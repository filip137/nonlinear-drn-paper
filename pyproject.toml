[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nonlinear-drn-paper"
version = "0.1.0"
description = "Reproducibility artifact for coordinate-descent simulation of nonlinear deep resistive networks"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {file = "LICENSE"}
authors = [
  {name = "Filip Osana"},
  {name = "Julie Grollier"},
  {name = "Damien Querlioz"},
]
dependencies = [
  "matplotlib==3.10.6",
  "numpy==2.0.1",
  "scikit-learn==1.7.2",
  "scipy==1.16.0",
  "sympy==1.13.1",
  "torch==2.5.1",
  "torchvision==0.20.1",
]

[project.urls]
Repository = "https://github.com/filip137/nonlinear-drn-paper"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "slow: full numerical replays or training runs",
]
