[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nonlinear-drn-paper"
version = "0.1.0"
description = "Reproducibility artifact for coordinate-descent simulation of nonlinear deep resistive networks"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = {file = "LICENSE"}
authors = [
  {name = "Filip Osana"},
  {name = "Julie Grollier"},
  {name = "Damien Querlioz"},
]
# requirements*.txt are the canonical environment locks. This portable metadata
# mirror is synchronization-tested; only Torch/Torchvision local wheel tags are
# omitted because CPU/CUDA indexes are selected by the requirements entrypoint.
dependencies = [
  "jsonschema==4.26.0",
  "matplotlib==3.10.6",
  "numpy==2.0.1; python_version == '3.12'",
  "numpy==2.1.3; python_version == '3.13'",
  "packaging==26.3",
  "scikit-learn==1.7.2",
  "scipy==1.16.0",
  "sympy==1.13.1",
  "threadpoolctl==3.6.0",
  "torch==2.5.1; python_version == '3.12'",
  "torch==2.6.0; python_version == '3.13'",
  "torchlambertw @ git+https://github.com/gmgeorg/torchlambertw.git@d365cac4d9a3e6074a03709cf865b4896e3f3cd4",
  "torchvision==0.20.1; python_version == '3.12'",
  "torchvision==0.21.0; python_version == '3.13'",
]

[project.urls]
Repository = "https://github.com/filip137/nonlinear-drn-paper"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "slow: full numerical replays or training runs",
]
